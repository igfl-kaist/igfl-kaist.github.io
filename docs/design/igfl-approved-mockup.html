<style>

function shuffle(previous){const next=[...previous];for(let i=next.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[next[i],next[j]]=[next[j],next[i]];}if(next.length>1&&next.every((p,i)=>p===previous[i]))[next[0],next[1]]=[next[1],next[0]];return next;}

 setAuthPurpose('signup');const p=draft.profile,o=draft.otp;
 if(draft.registered)return `<section class="ig-emailbox"><div class="ig-success-mark"><i data-lucide="check" aria-hidden="true"></i></div><div class="ig-eyebrow">WELCOME TO IGFL</div><h1 class="ig-compact-title">이제, 함께 뛸 준비가 됐어요.</h1><p class="ig-note">이메일 인증과 정보 입력을 마치면 운영진의 사전 승인 없이 선수로 등록돼요.</p><div class="ig-panel" style="margin-top:25px">${playerCard({...demoViewer,name:p.name,lab:p.lab,canReferee:p.referee})}</div><p class="ig-caption">등록 완료 상태를 보여주는 시안이에요. 실제 계정은 생성되지 않았어요.</p><div class="ig-actions"><button type="button" class="ig-action cursor-interaction" data-go="teams">팀 만나러 가기 ↗</button>${action('등록 화면 다시 보기','signup-reset',true)}</div></section>`;
 return `<section class="ig-emailbox">${pageTop('JOIN IGFL','필드에서 만나요.','팀이 없어도 괜찮아요. 선수 등록부터 시작해요.')}<div class="ig-stepsline"><span class="${draft.signupStep===0?'ig-active':''}"><b>${draft.verified?'✓':'1'}</b>학교 이메일 인증</span><span class="${draft.signupStep===1?'ig-active':''}"><b>2</b>선수 정보 등록</span></div>${draft.signupStep===0?`
 <div class="ig-panel"><div class="ig-section-label"><h2>KAIST 이메일로 시작해요</h2></div><p class="ig-note">학교 공식 이메일로 받은 숫자 6자리를 입력해주세요. 인증번호는 5분 동안 유효해요.</p><div class="ig-emailrow">${field('학교 이메일','profile.email',p.email,'email')}${action(o.code?'인증번호 다시 받기':'인증번호 받기','otp-send',true)}</div>
 ${o.code?`<div class="ig-otp-block"><div class="ig-section-label"><label for="ig-otp">인증번호 6자리</label><span class="ig-pending" data-otp-timer role="timer" aria-label="인증번호 남은 시간">${otpTime()}</span></div><div class="ig-emailrow"><input id="ig-otp" class="ig-otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" data-otp-input value="${esc(o.input)}" placeholder="000000" aria-label="인증번호 6자리">${action('인증하고 계속하기 ↗','otp-verify',false,otpRemaining()===0)}</div><p class="ig-caption" data-otp-status>${otpRemaining()?'메일에서 인증번호를 확인해주세요.':'인증번호가 만료됐어요. 새 번호를 받아주세요.'}</p><div class="ig-preview-code">시안 체험용 번호 <strong>${o.code}</strong><span>실제 이메일은 보내지 않아요.</span></div></div>`:'<p class="ig-caption" style="margin-top:12px">시안에서는 이메일 발송 대신 체험용 인증번호를 표시해요.</p>'}${notice()}</div>
 <div class="ig-panel ig-panel-soft"><h2 style="font-size:14px;margin-bottom:10px">IGFL 참가 자격</h2><p class="ig-note">① GSDS·ISE 소속 대학원생<br>② GSDS·ISE 소속 교직원<br>③ 지도교수가 GSDS·ISE 소속인 다른 학과 대학원생</p></div>`:`
 <div class="ig-section-label"><span class="ig-pending">✓ 학교 이메일 인증 완료</span><span class="ig-caption">${esc(p.email)}</span></div><div class="ig-panel"><div class="ig-section-label"><h2>선수 기본 정보</h2><span class="ig-caption">별도 표시 외 필수</span></div><div class="ig-fields">${dropdown('참가 자격','profile.kind',p.kind,[['student','GSDS·ISE 대학원생'],['staff','GSDS·ISE 교직원'],['other','타 학과 대학원생 · 지도교수 소속 기준']],'',true)}${field('이름','profile.name',p.name)}${field(p.kind==='staff'?'사번':'학번','profile.id',p.id)}${field('소속 학과 / 부서','profile.dept',p.dept)}${field('소속 연구실 · 공개','profile.lab',p.lab,'text',p.kind==='staff'?'연구실이 없으면 소속 부서로 표기하는 안이에요.':'팀과 선수 페이지에 공개돼요.')}${field('지도교수','profile.advisor',p.kind==='staff'?'해당 없음':p.advisor,'text',p.kind==='other'?'GSDS·ISE 소속 지도교수를 입력해주세요.':'',false,p.kind==='staff')}${dropdown('소속 팀 · 선택','profile.team',p.team,[['','무소속으로 시작할게요'],...teams.map(t=>[t.id,t.name])],'팀을 선택해도 자동 소속되지는 않아요. 협의 후 팀 대표가 영입을 등록해요.',true)}</div>
 <div class="ig-toggle-row"><div><strong>심판으로도 함께할 수 있나요?</strong><p class="ig-caption">심판 수당은 한 경기당 20,000원이에요.<br>각 팀이 10,000원씩 심판에게 직접 지급해요.</p></div><label class="ig-check cursor-interaction"><input type="checkbox" data-field="profile.referee" ${p.referee?'checked':''}>심판 가능</label></div>${privateNote()}
 <div class="ig-consent"><label class="ig-check cursor-interaction"><input type="checkbox" data-consent ${draft.consent?'checked':''}><span>개인정보 수집 및 이용에 동의합니다. <small>필수</small></span></label><p class="ig-caption">리그 참가 자격 확인, 선수·팀 관리와 경기 운영을 위해 입력 정보를 수집·이용해요.</p><details><summary class="cursor-interaction">수집·이용 안내</summary><p class="ig-caption">수집 항목: 이메일, 이름, 학번/사번, 소속, 연구실, 지도교수, 심판 가능 여부와 팀 정보.<br>공개 범위는 위 안내와 같아요. 동의를 거부할 수 있지만 선수 등록은 어려워요.<br>기본 정보는 회원 탈퇴 시 삭제하고 개인 시즌 기록은 회원 유지 중이며 시즌 종료 후 최대 2년 이내 보관해요. 팀 경기 결과와 Elo는 개인 식별 정보를 제거해 유지해요.</p></details></div><div class="ig-consent"><label class="ig-check cursor-interaction"><input type="checkbox" data-public-consent ${draft.publicConsent?'checked':''}><span>이름·연구실 및 리그 기록 공개에 동의합니다. <small>필수</small></span></label><p class="ig-caption">인터넷 방문자에게 공개되며 동의하지 않으면 선수 등록을 완료할 수 없어요.</p></div>${notice()}<div class="ig-formfoot">${action('← 이메일 단계','signup-back',true)}${action('선수 등록 완료 미리보기 ↗','signup-submit')}</div></div>`}</section>`;
}
function rolePage(role){return role==='admin'?'admin':role==='referee'?'referee':['captain','vice'].includes(role)&&['주장','부주장'].includes(viewer().role)&&viewer().team?'manage':'member';}
function viewer(){return players[({captain:0,vice:1,player:2,referee:18})[state.role]??2];}
function workspace(content){
 const labels={captain:`김도윤 · ${players[0].role}`,vice:`이서준 · ${players[1].role}`,player:'박지훈 · 일반 선수',referee:'남서현 · 선수 / 심판',admin:'IGFL 운영진'};
 const managing=['captain','vice'].includes(state.role)&&['주장','부주장'].includes(viewer().role)&&viewer().team==='optimal';
 const nav=state.role==='admin'?[['admin','운영 관리']]:[['member','내 선수 활동'],...(managing?[['manage','팀 관리'],['schedule','경기 일정 등록'],['result','경기 결과 등록']]:[]),...(viewer().canReferee?[['referee','심판 활동']]:[])];
 return `<div class="ig-workhead"><div class="ig-workidentity">${state.role==='admin'?'<span class="ig-avatar"><i data-lucide="shield-check" aria-hidden="true"></i></span>':crest(state.role==='referee'?teams[2]:teams[0])}<div><strong>${state.role==='admin'?'IGFL 운영 데스크':state.role==='referee'?'남서현의 IGFL':managing?'OPTIMAL FC':'박지훈의 IGFL'}</strong><span class="ig-caption">${state.role==='admin'?'리그의 신청과 검토 요청을 확인해요.':state.role==='referee'?'필드 위의 공정한 경기를 함께 만들어요.':'연구실 밖에서, 함께 뛰는 우리.'}</span></div></div><label class="ig-role">로그인 역할 미리보기<select data-viewer class="cursor-interaction" aria-label="로그인 역할 미리보기">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${state.role===v?'selected':''}>${l}</option>`).join('')}</select></label></div><nav class="ig-worknav" aria-label="로그인 후 메뉴">${nav.map(([v,l])=>`<button type="button" data-go="${v}" class="cursor-interaction" ${state.page===v?'aria-current="page"':''}>${l}</button>`).join('')}</nav>${content}`;
}
function activeMembers(){return members(teams[0]).filter(p=>!draft.released.has(p.id));}
function opponent(){return teams.find(t=>t.id===draft.match.opponent);}
function eligibleRefs(){return players.filter(p=>p.canReferee&&p.team!=='optimal'&&p.team!==draft.match.opponent);}
function manage(){const t=teams[0],list=activeMembers();return workspace(`${pageTop('MY TEAM','우리 팀, 함께 관리해요.','팀의 얼굴부터 다음 경기까지. 주장과 부주장이 함께 관리해요.')}<div class="ig-workcols"><div><section class="ig-panel"><div class="ig-section-label"><h2>팀 프로필</h2><span class="ig-pending">등록 승인 완료</span></div><div class="ig-upload">${art(t)}<div><label class="ig-fieldbox"><span>팀 대표 이미지</span><input type="file" accept="image/png,image/jpeg,image/webp" data-team-image aria-label="팀 대표 이미지 업로드"></label><p class="ig-caption">미등록 시 지금의 기본 이미지를 사용해요.</p><p class="ig-caption">JPG · PNG · WebP / 3MB 이하 · 시안 제안</p>${t.image?action('기본 이미지로 되돌리기','image-reset',true):''}</div></div><label class="ig-fieldbox"><span>팀 소개</span><textarea data-field="teamTag">${esc(t.tag)}</textarea></label><div class="ig-toggle-row"><div><strong>새로운 선수를 기다리고 있나요?</strong><p class="ig-caption">공개 팀 카드에 주황색 모집 배지를 표시해요.</p></div><label class="ig-check cursor-interaction"><input type="checkbox" data-field="recruiting" ${t.recruiting?'checked':''}>선수 모집 중</label></div><div class="ig-actions">${action('팀 정보 저장 미리보기','team-save',true)}<button type="button" data-team="optimal" class="ig-quiet cursor-interaction">공개 팀 페이지 ↗</button></div>${notice()}</section>${leadershipPanel()}${teamStandingPanel(t)}<section class="ig-panel"><div class="ig-section-label"><h2>함께 뛰는 선수 <span class="ig-caption">${list.length} / 20명</span></h2><span class="ig-caption">팀 유지 기준 6~20명</span></div>${list.map(p=>`<div class="ig-member-row"><span class="ig-avatar">${p.name[0]}</span><div class="ig-member-name"><strong>${p.name}</strong><small>${p.lab}</small></div>${p.role==='주장'||p.role==='부주장'?`<span class="ig-caption">${p.role}</span>`:`<button type="button" class="ig-quiet cursor-interaction" data-act="release-${p.id}">방출</button>`}</div>`).join('')}<p class="ig-caption" style="margin-top:16px">방출 전 다시 확인해요. 6명 미만이면 리그 참가 유예로 전환하고 인원 충원을 기다려요.</p></section></div><aside><section class="ig-panel"><div class="ig-section-label"><h2>가입 요청</h2><span class="ig-caption">${draft.request==='pending'?'1건':'처리 완료'}</span></div><div class="ig-workidentity"><span class="ig-avatar">나</span><div><strong style="font-size:14px">나은재</strong><p class="ig-caption">최적화연구실 · 무소속 신청 예시</p></div></div><p class="ig-request-copy">“안녕하세요. 연구실 동료들과 함께 풋살을 즐기고 싶어요!”</p>${draft.request==='pending'?`<div class="ig-tiny-actions">${action('영입 미리보기','accept-member')}${action('거절','reject-member',true)}</div>`:`<span class="ig-pending">${draft.request==='accepted'?'팀 합류 완료 · 시안':'요청 거절 · 시안'}</span>`}</section><section class="ig-panel ig-panel-soft"><h2 style="font-size:16px">다음 경기 준비</h2><p class="ig-note" style="margin-top:12px">OPTIMAL FC × ${opponent().name}<br>${esc(draft.match.date)} · ${esc(draft.match.time)}<br>${esc(draft.match.place)}</p><div class="ig-tiny-actions"><button type="button" class="ig-action ig-secondary cursor-interaction" data-go="schedule">우리 팀 명단 등록 ↗</button></div></section></aside></div>`);}
function rosterPicker(mode){const list=activeMembers(),selected=draft.selected[mode];return `<section class="ig-team-pick"><div class="ig-roster-head"><h3>OPTIMAL FC · 우리 팀</h3><span class="ig-caption">${list.filter(p=>selected.has(p.id)).length}명 선택</span></div><div class="ig-roster-pick">${list.map(p=>`<label class="ig-check cursor-interaction"><input type="checkbox" data-roster="${mode}" value="${p.id}" ${selected.has(p.id)?'checked':''}><span>${p.name}<small>${p.lab}</small></span></label>`).join('')}</div></section>`;}
function resetAssignment(){const m=draft.match;m.requested=false;m.sentTo=[];m.winner=null;m.accepted=false;m.submitted=false;m.declined.clear();m.externalConfirmed=false;draft.ref.invite='pending';m.revision++;}
function acceptReferee(id){const m=draft.match;if(members(teams[0]).length<6||members(opponent()).length<6){draft.notice='인원 미달로 참가 유예 중인 팀이 있어 공식 등록을 보류해요.';return;}if(m.winner!==null){draft.notice=`${players[m.winner].name} 심판이 먼저 수락해 배정이 마감됐어요. 기존 배정은 바뀌지 않아요.`;return;}if(!m.requested||m.refType!=='internal'||!m.sentTo.includes(id)||m.declined.has(id)||!eligibleRefs().some(p=>p.id===id)){draft.notice='수락 가능한 요청이 아니에요. 최신 배정 상태를 확인해주세요.';return;}m.winner=id;m.referee=String(id);m.accepted=true;m.submitted=true;draft.ref.invite='accepted';draft.notice=`${players[id].name} 심판이 가장 먼저 수락했어요. 공식 경기 일정 등록을 완료하고 다른 후보의 요청을 종료해요. 실제 메일·저장은 연결 전이에요.`;}
function requestStatus(id){const m=draft.match;return m.winner===id?'배정 확정':m.winner!==null?'다른 심판 배정 · 요청 종료':m.declined.has(id)?'요청 거절':'수락 대기';}
function schedule(){const m=draft.match,locked=m.requested||m.winner!==null;return workspace(`${pageTop('MATCH SCHEDULE',m.submitted?'함께할 심판이 정해졌어요.':m.requested?'심판의 수락을 기다려요.':'다음 경기를 준비해요.','상대 팀과 합의한 일정과 우리 팀 출전 예정 선수를 등록해요.')}<div class="ig-workcols"><div><section class="ig-panel"><div class="ig-section-label"><h2>경기 일정</h2><span class="${m.submitted?'ig-pending':'ig-recruit-badge'}">${m.submitted?'공식 등록 완료':m.requested?'심판 배정 중 · 공식 등록 보류':'작성 중 · 미등록'}</span></div><div class="ig-fields">${dropdown('상대 팀','match.opponent',m.opponent,teams.slice(1).map(t=>[t.id,t.name]),'',true)}${field('경기 날짜','match.date',m.date,'date')}${field('시작 시간','match.time',m.time,'time')}${field('장소','match.place',m.place,'text','',true)}</div><p class="ig-caption" style="margin-top:14px">대진·일시·장소를 수정하면 기존 요청과 배정을 해제하고 다시 요청해요.</p></section><section class="ig-panel"><div class="ig-section-label"><h2>우리 팀 출전 예정 선수</h2><span class="ig-caption">복수 선택</span></div><p class="ig-caption" style="margin-bottom:17px">상대 팀 명단은 상대 팀의 주장·부주장이 직접 등록해요.</p>${rosterPicker('schedule')}</section>${m.requested?`<section class="ig-panel"><div class="ig-section-label"><h2>심판 요청 현황</h2><span class="ig-caption">${m.sentTo.length}명에게 동시 요청</span></div>${m.sentTo.map(id=>`<div class="ig-member-row"><span class="ig-avatar">${players[id].name[0]}</span><div class="ig-member-name"><strong>${players[id].name}</strong><small>${teamFor(players[id])?.name||'무소속'} · ${m.winner===null?'요청 이메일 알림 대상':'요청 처리 완료'}</small></div><span class="ig-caption">${requestStatus(id)}</span></div>`).join('')}<div class="ig-message">${m.winner!==null?`${players[m.winner].name} 심판 배정 확정 · 나머지 요청 자동 종료`:'아직 수락한 심판이 없어 공식 등록을 보류하고 있어요.'}</div><details class="ig-scenario"><summary class="cursor-interaction">수락 순서 비교 · 시안</summary><p class="ig-caption">실제 수락은 심판 본인의 홈페이지에서 진행해요.</p><div class="ig-tiny-actions">${m.sentTo.map(id=>`<button type="button" class="ig-action ig-secondary cursor-interaction" data-act="ref-sim-accept" data-ref-accept="${id}">${players[id].name} ${m.winner===null?'수락 예시':'뒤늦은 수락 예시'}</button>`).join('')}</div></details></section>`:''}</div><aside><section class="ig-panel"><div class="ig-section-label"><h2>함께할 심판</h2></div><div class="ig-fields">${dropdown('심판 구분','match.refType',m.refType,[['internal','IGFL 내부 심판'],['external','외부 심판']],'',true)}</div>${m.refType==='internal'?`<p class="ig-note">여러 명을 선택해 동시에 요청할 수 있어요. 가장 먼저 수락한 한 명이 담당 심판으로 확정돼요.</p><p class="ig-caption">양 팀 소속 선수는 후보에서 제외돼요.</p><div class="ig-ref-options">${eligibleRefs().map(p=>`<label class="ig-check ig-ref-option cursor-interaction"><input type="checkbox" data-ref-candidate value="${p.id}" ${m.candidates.has(p.id)?'checked':''} ${locked?'disabled':''}><span><strong>${p.name}</strong><small>${teamFor(p)?.name||'무소속'}</small></span></label>`).join('')}</div><p class="ig-caption">선택한 심판에게 요청 이메일을 보내고, 수락은 홈페이지에서 받아요.</p>${locked?action('심판 요청 다시 구성','ref-request-reset',true):''}`:`${field('외부 심판 이름','match.external',m.external)}<label class="ig-check cursor-interaction" style="margin-top:15px"><input type="checkbox" data-external-assigned ${m.externalConfirmed?'checked':''}>외부 심판의 경기 진행 수락을 확인했어요.</label><p class="ig-caption">외부 심판 수락은 대표가 확인해 기록하는 안이에요. 결과는 운영진이 최종 승인해요.</p>`}</section><section class="ig-panel ig-panel-soft"><h2 style="font-size:14px;margin-bottom:10px">공식 경기 안내</h2><p class="ig-note">5대5 · 20분 / 5분 / 20분<br>무제한 교체 · 동점 시 승부차기</p><p class="ig-note"><strong>심판비 총 20,000원</strong><br>각 팀이 심판에게 10,000원씩 직접 지급해요.</p><p class="ig-note">심판이 배정되기 전에는 공식 경기 일정으로 등록하지 않아요.</p></section></aside></div>${notice()}<div class="ig-formfoot"><span class="ig-caption">${m.submitted?'배정 완료 · 공식 일정에 반영된 상태 예시':'우리 팀 명단만 저장하고, 배정 전에는 대기 상태로 보관해요.'}</span>${action(m.submitted?'공식 등록 완료':m.requested?'심판 수락 대기':m.refType==='external'?'외부 심판 배정 확인 후 등록 ↗':`심판 ${m.candidates.size}명에게 요청 ↗`,'schedule-submit',false,m.requested||m.submitted)}</div>`);}
function refRequestPanel(){const m=draft.match,p=viewer(),sent=m.requested&&m.refType==='internal'&&m.sentTo.includes(p.id),closed=m.winner!==null,declined=m.declined.has(p.id);return `<section class="ig-panel"><div class="ig-rowhead"><h2>경기 배정 요청</h2><span class="ig-pending">${sent?requestStatus(p.id):'새 요청 없음'}</span></div>${sent?`<div class="ig-workcols"><div><h3 class="ig-matchtitle">OPTIMAL FC × ${opponent().name}</h3><dl class="ig-detail-list"><dt>경기 일정</dt><dd>${esc(m.date)} · ${esc(m.time)}</dd><dt>장소</dt><dd>${esc(m.place)}</dd><dt>심판 후보</dt><dd>양 팀 소속이 아닌 ${m.sentTo.length}명에게 요청</dd><dt>심판비</dt><dd>총 20,000원 · 각 팀 10,000원 직접 지급</dd></dl></div><div><p class="ig-note">${closed?m.winner===p.id?'내가 먼저 수락한 경기예요. 공식 일정 등록이 완료됐어요.':`${players[m.winner].name} 심판이 먼저 수락해 요청이 종료됐어요.`:declined?'거절한 요청이에요. 다른 후보의 수락을 기다리고 있어요.':'가장 먼저 수락한 한 명에게 배정돼요. 배정이 끝난 요청은 수락할 수 없어요.'}</p>${!closed&&!declined?`<div class="ig-actions">${action('배정 수락','ref-invite-accept')}${action('배정 거절','ref-invite-decline',true)}</div>`:''}<p class="ig-caption" style="margin-top:15px">요청 이메일은 홈페이지로 이동하는 알림이에요. 메일을 열거나 링크를 누르는 것만으로 수락되지 않아요.</p></div></div>`:`<p class="ig-note">나에게 온 심판 요청이 없어요. 요청을 받으면 이메일과 이 화면에서 확인할 수 있어요.</p>${action('배정 요청 예시 불러오기','ref-load-example',true)}`}</section>`;}
function goalRows(){return `<div class="ig-team-pick"><div class="ig-roster-head"><h3>OPTIMAL FC · 우리 팀</h3><span class="ig-caption">정규시간 득점</span></div>${activeMembers().filter(p=>draft.selected.result.has(p.id)).map(p=>`<label class="ig-goal-row"><span>${p.name}</span><input type="number" min="0" max="99" data-goal="${p.id}" value="${draft.goals[p.id]||0}" aria-label="${p.name} 득점"><small>골</small></label>`).join('')}</div>`;}
function scoresMatch(){const r=draft.result,o=r.opponentRecord;return Boolean(o&&r.a===o.a&&r.b===o.b&&(r.a!==r.b||(r.pa===o.pa&&r.pb===o.pb)));}
function scoreText(r){return `${r.a} : ${r.b}${r.a===r.b?` (PK ${r.pa} : ${r.pb})`:''}`;}
function comparison(r=draft.result,o=r.opponentRecord){return `<table class="ig-score-compare"><caption>OPTIMAL FC : GRADIENT FC 순서로 비교</caption><thead><tr><th>제출 팀</th><th>기록 상태</th><th>스코어</th></tr></thead><tbody><tr><td>OPTIMAL FC</td><td>우리 팀 ${r.submitted===false?'작성 중':'제출'}</td><td>${scoreText(r)}</td></tr><tr><td>GRADIENT FC</td><td>${o?'상대 팀 제출':'미제출'}</td><td>${o?scoreText(o):'—'}</td></tr></tbody></table>`;}
function result(){const r=draft.result,tied=r.a===r.b,blocked=r.disputed||r.conflict||(r.opponentRecord&&!scoresMatch());
 if(r.submitted)return workspace(`${pageTop('MATCH RESULT',r.final?'공식 결과가 확정됐어요.':blocked?'기록 확정을 보류했어요.':r.opponentRecord?'양 팀 스코어가 일치해요.':'우리 팀 기록을 제출했어요.','각 팀이 자기 팀의 출전 명단과 득점을 직접 기록해요.')}<div class="ig-workcols"><section class="ig-panel"><span class="${blocked?'ig-recruit-badge':'ig-pending'}">${r.final?'공식 확정 · 시안':blocked?'운영진 검토 대기':r.opponentRecord?'최종 승인 대기':'상대 팀 제출 대기'}</span><h2 class="ig-matchtitle">OPTIMAL FC × GRADIENT FC</h2><p class="ig-caption">2026.10.15 · KAIST 풋살장</p>${comparison()}${blocked?'<div class="ig-warn" role="status">스코어 불일치 또는 이의 제기로 공식 기록·Elo 반영을 보류했어요. 운영진 알림 대상에 추가돼요. 실제 메일은 발송하지 않아요.</div>':''}<p class="ig-caption">우리 팀 실제 출전 ${activeMembers().filter(p=>draft.selected.result.has(p.id)).length}명 · 득점 ${Object.values(draft.goals).reduce((a,b)=>a+b,0)}골</p><div class="ig-formfoot">${action('우리 팀 기록 수정','result-edit',true)}${!r.final?action('이의 제기 미리보기','dispute',true):''}</div>${notice()}</section><aside><section class="ig-panel ig-panel-soft"><div class="ig-section-label"><h2>확정 진행 상황</h2></div><ol class="ig-flow">${[['우리 팀 제출','주장 또는 부주장 1명 확인',true],['상대 팀 제출',r.opponentRecord?'제출 완료':'상대 팀이 명단·득점을 직접 입력',!!r.opponentRecord],['스코어 일치 확인',blocked?'검토가 끝날 때까지 확정 보류':r.opponentRecord?'정규시간·승부차기 대조 완료':'양 팀 제출 후 자동 비교',!!r.opponentRecord&&!blocked],['최종 승인',draft.match.refType==='internal'?'담당 심판이 확인':'외부 심판 경기 · 운영진이 확인',r.final]].map(([a,b,done],i)=>`<li class="${done?'ig-done':''}"><span class="ig-flow-dot">${done?'✓':i+1}</span><div><strong>${a}</strong><small>${b}</small></div></li>`).join('')}</ol></section><section class="ig-panel"><h2 style="font-size:14px">상대 팀 제출 상태 비교</h2><p class="ig-caption" style="margin-top:7px">디자인 검토용 상황 전환이에요.</p><div class="ig-tiny-actions">${action('일치한 제출 예시','other-match',true)}${action('불일치한 제출 예시','other-mismatch',true)}</div></section></aside></div>`);
 return workspace(`${pageTop('MATCH RESULT','우리 팀의 경기를 기록해요.','전체 스코어를 적고, 우리 팀 출전 선수와 득점만 입력해주세요.')}<div class="ig-workcols"><div><section class="ig-panel"><div class="ig-section-label"><h2>경기 스코어</h2><span class="ig-pending">경기 완료 예시</span></div><p class="ig-caption">2026.10.15 · KAIST 풋살장 · OPTIMAL FC × GRADIENT FC</p><div class="ig-scoreline"><label>OPTIMAL FC<input type="number" min="0" data-field="result.a" value="${r.a}" aria-label="우리 팀 정규시간 스코어"></label><span>:</span><label>GRADIENT FC<input type="number" min="0" data-field="result.b" value="${r.b}" aria-label="상대 팀 정규시간 스코어"></label></div><p class="ig-caption" style="text-align:center">전·후반 합산 스코어</p>${tied?`<section class="ig-shootout"><h3 style="font-size:13px">승부차기 결과</h3><div class="ig-scoreline"><label>OPTIMAL FC<input type="number" min="0" data-field="result.pa" value="${r.pa}" aria-label="우리 팀 승부차기 스코어"></label><span>:</span><label>GRADIENT FC<input type="number" min="0" data-field="result.pb" value="${r.pb}" aria-label="상대 팀 승부차기 스코어"></label></div><p class="ig-caption">승부차기 득점은 개인 득점에 포함하지 않아요.</p></section>`:''}</section><section class="ig-panel"><div class="ig-section-label"><h2>우리 팀 실제 출전 선수</h2><span class="ig-caption">복수 선택</span></div>${rosterPicker('result')}</section><section class="ig-panel"><div class="ig-section-label"><h2>우리 팀 득점 기록</h2><span class="ig-caption">출전 선수만 표시</span></div>${goalRows()}<p class="ig-caption" style="margin-top:16px">우리 팀 득점 합계만 우리 팀 스코어와 비교해요.</p></section></div><aside><section class="ig-panel ig-panel-soft"><h2 style="font-size:16px;margin-bottom:12px">양 팀이 따로 기록해요</h2><p class="ig-note">상대 팀 출전 명단과 득점은 상대 팀이 입력해요.</p><p class="ig-note">양 팀의 스코어가 일치해야 심판 최종 승인으로 이어져요. 불일치하면 운영진에게 알리고 확정을 보류해요.</p><p class="ig-note">외부 심판 경기는 운영진이 최종 승인해요.</p></section></aside></div>${notice()}<div class="ig-formfoot"><span class="ig-caption">${state.role==='vice'?'이서준 부주장':'김도윤 주장'}으로 우리 팀 기록을 확인해요.</span>${action('우리 팀 기록 확인 및 제출 ↗','result-submit')}</div>`);
}
function leader(t,role){return members(t).find(p=>p.role===role)?.name||'공석';}
function refreshStanding(t){if(!t)return;if(members(t).length<6){if(!t.graceStart)t.graceStart=Date.now();if(t.id==='optimal'||t.id===draft.match.opponent)draft.match.submitted=false;}else {delete t.graceStart;}}
function teamStandingPanel(t){const count=members(t).length;if(count>=6)return '';const end=new Date((t.graceStart||Date.now())+60*86400000).toLocaleDateString('ko-KR');return `<section class="ig-panel ig-panel-soft"><div class="ig-rowhead"><h2>리그 참가 유예</h2><span class="ig-recruit-badge">${count}명 / 최소 6명</span></div><p class="ig-note">공식 경기와 현재 순위 참여를 잠시 쉬어요. ${end}까지 6명을 충원하면 복귀하고, 충원하지 못하면 리그에서 제외돼요.</p><p class="ig-caption">유예기간은 우선 60일 기본안이에요. 팀과 과거 경기 기록을 삭제하지 않아요.</p></section>`;}
function setAuthPurpose(purpose){if(draft.authPurpose===purpose)return;draft.authPurpose=purpose;draft.otp={code:'',input:'',expires:0,email:'',attempts:0};draft.verified=false;draft.signupStep=0;}
function login(){setAuthPurpose('login');const o=draft.otp;return `<section class="ig-emailbox">${pageTop('WELCOME BACK','다시, 함께 뛰어요.','학교 이메일로 받은 인증번호로 간편하게 로그인해요.')}<section class="ig-panel"><div class="ig-section-label"><h2>학교 이메일 로그인</h2><span class="ig-pending">비밀번호 없이</span></div><p class="ig-note">KAIST 이메일로 숫자 6자리를 보내드려요.<br>인증번호는 5분 동안 유효해요.</p><div class="ig-emailrow">${field('학교 이메일','profile.email',draft.profile.email,'email')}${action(o.code?'인증번호 다시 받기':'인증번호 받기','otp-send',true)}</div>${o.code?`<div class="ig-otp-block"><div class="ig-section-label"><label for="ig-login-otp">인증번호 6자리</label><span class="ig-pending" data-otp-timer role="timer" aria-label="인증번호 남은 시간">${otpTime()}</span></div><div class="ig-emailrow"><input id="ig-login-otp" class="ig-otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" data-otp-input value="${esc(o.input)}" placeholder="000000" aria-label="인증번호 6자리">${action('인증하고 로그인 ↗','otp-verify',false,otpRemaining()===0)}</div><p class="ig-caption" data-otp-status>${otpRemaining()?'학교 메일에서 인증번호를 확인해주세요.':'인증번호가 만료됐어요. 새 번호를 받아주세요.'}</p><div class="ig-preview-code">시안 체험용 번호 <strong>${o.code}</strong><span>실제 이메일은 보내지 않아요.</span></div></div>`:'<p class="ig-caption" style="margin-top:15px">시안에서는 실제 메일 대신 체험용 번호를 표시해요.</p>'}${notice()}</section><div class="ig-login-bottom"><span>처음 방문하셨나요?</span><button type="button" class="ig-team-link cursor-interaction" data-go="signup">선수 등록하기 ↗</button></div><div class="ig-panel ig-panel-soft"><h2 style="font-size:14px">나의 IGFL을 한곳에서</h2><p class="ig-note">출전 기록, 우리 팀 관리와 심판 활동까지.<br>로그인이 유지되는 동안에는 번호를 다시 받을 필요가 없어요.</p><button type="button" class="ig-quiet cursor-interaction" data-go="portal">역할별 화면 둘러보기 ↗</button></div></section>`;}
function leadershipPanel(){const r=draft.leadership,t=teams[0],options=activeMembers().map(p=>[p.id,`${p.name} · ${p.lab}`]);return `<section class="ig-panel"><div class="ig-rowhead"><h2>주장·부주장 교체</h2><span class="ig-pending">${r.status==='pending'?'운영진 승인 대기':r.status==='approved'?'교체 승인 완료':r.status==='returned'?'보완 요청':'팀 대표 관리'}</span></div><p class="ig-note">팀 안에서 논의한 새 대표를 등록해주세요. 운영진이 승인할 때부터 권한이 바뀌어요.</p><p class="ig-caption">현재 주장 ${leader(t,'주장')} · 부주장 ${leader(t,'부주장')}</p>${r.status==='pending'?`<div class="ig-message">교체 요청: 주장 ${players[r.request.captain].name} · 부주장 ${players[r.request.vice].name}<br>승인 전에는 기존 대표의 권한을 유지해요.</div>`:`<div class="ig-fields" style="margin-top:18px">${dropdown('새 주장','leadership.captain',r.captain,options)}${dropdown('새 부주장','leadership.vice',r.vice,options)}</div><div class="ig-actions">${action('대표 교체 요청','leader-request',true)}</div>`}</section>`;}
function adminLeadership(){const r=draft.leadership;return `<section class="ig-panel"><div class="ig-rowhead"><h2>주장·부주장 교체 요청</h2><span class="ig-pending">${r.status==='pending'?'승인 대기':r.status==='approved'?'승인 완료':r.status==='returned'?'보완 요청':'대기 요청 없음'}</span></div><h3 class="ig-matchtitle">OPTIMAL FC</h3><p class="ig-note">현재 주장 ${leader(teams[0],'주장')} · 부주장 ${leader(teams[0],'부주장')}</p>${r.request?`<dl class="ig-detail-list"><dt>새 주장</dt><dd>${players[r.request.captain].name}</dd><dt>새 부주장</dt><dd>${players[r.request.vice].name}</dd></dl><p class="ig-caption">승인 시 현재 소속과 요청 버전을 다시 확인하고 두 대표의 권한을 함께 변경해요.</p>${adminNote()}<div class="ig-actions">${action('대표 교체 승인','leader-approve',false,r.status!=='pending')}${action('보완 요청','leader-return',true,r.status!=='pending')}</div>`:'<p class="ig-note">팀 대표가 교체 요청을 등록하면 여기에 표시돼요.</p>'}</section>`;}
function member(){const p=viewer(),t=teamFor(p),m=draft.match;return workspace(`${pageTop('MY IGFL',`${p.name}님, 필드에서 만나요.`,'나의 팀과 출전 일정을 편하게 확인해요.')}<div class="ig-workcols"><div><section class="ig-panel"><div class="ig-rowhead"><h2>내 선수 프로필</h2><span class="ig-pending">IGFL 등록 선수${p.canReferee?' / 심판':''}</span></div><div class="ig-workidentity"><span class="ig-avatar">${p.name[0]}</span><div><strong>${p.name}</strong><p class="ig-caption">${p.lab} · ${t?t.name:'무소속'}${['주장','부주장'].includes(p.role)?` · ${p.role}`:''}</p></div></div><div class="ig-recordline"><div><strong>8</strong><span>시즌 출전 · 예시</span></div><div><strong>6</strong><span>최근 5경기 득점 · 예시</span></div></div>${privateNote()}</section>${t?teamStandingPanel(t):''}<section class="ig-panel"><h2>${t?'나의 다음 경기':'함께할 팀을 찾아볼까요?'}</h2>${!t?'<p class="ig-note">팀을 나와도 선수 등록과 지난 경기 기록은 유지돼요. 모집 중인 팀에 새로 가입을 요청할 수 있어요.</p><div class="ig-actions"><button type="button" class="ig-action cursor-interaction" data-go="teams">모집 중인 팀 만나기 ↗</button></div>':t.id==='optimal'&&(m.requested||m.submitted)?`<h3 class="ig-matchtitle">OPTIMAL FC × ${opponent().name}</h3><p class="ig-note">${esc(m.date)} · ${esc(m.time)} · ${esc(m.place)}<br>${m.submitted?`심판 ${players[m.winner]?.name||esc(m.external)} · 배정 확정`:'심판 배정 중 · 공식 등록 보류'}</p><p class="ig-caption">예정 명단: ${draft.selected.schedule.has(p.id)?'출전 예정':'미포함'}</p>`:'<p class="ig-note">아직 공식 등록된 출전 예정 경기가 없어요.</p>'}</section>${notice()}</div><aside><section class="ig-panel ig-panel-soft"><h2 style="font-size:16px">${t?'내 소속 팀':'현재 무소속이에요'}</h2><p class="ig-note" style="margin-top:13px">${t?`${t.name}<br>주장 ${leader(t,'주장')} · 부주장 ${leader(t,'부주장')}`:'팀마다 협의한 뒤 홈페이지에서 새로 영입될 수 있어요.'}</p>${t?`<div class="ig-inline-links"><button type="button" data-team="${t.id}" class="cursor-interaction">팀 페이지 보기 ↗</button></div><div class="ig-leave-area"><p class="ig-caption">대표 승인 없이 바로 탈퇴해요. 처리 전에 한 번 더 확인할게요.</p><button type="button" class="ig-quiet ig-danger-text cursor-interaction" data-act="leave-team">팀 탈퇴</button></div>`:''}</section>${p.canReferee?'<section class="ig-panel"><h2 style="font-size:14px">선수이자 심판으로 함께해요</h2><p class="ig-note">출전 기록은 ‘내 선수 활동’, 배정과 승인은 ‘심판 활동’에서 확인해요.</p><button type="button" data-go="referee" class="ig-action ig-secondary cursor-interaction">심판 활동 보기 ↗</button></section>':''}<button type="button" class="ig-quiet cursor-interaction" data-act="logout-preview">로그아웃 미리보기</button></aside></div>`);}
function openLeave(){const p=viewer(),t=teamFor(p);if(!t)return;draft.pendingLeave={playerId:p.id,teamId:t.id};const modal=root.querySelector('.ig-dialog');modal.querySelector('.ig-dialog-content').innerHTML=`<span class="ig-modal-icon"><i data-lucide="log-out" aria-hidden="true"></i></span><h2 id="ig-dialog-title">${esc(t.name)}에서 탈퇴할까요?</h2><p class="ig-note">확인하면 주장·부주장 승인 없이 바로 무소속이 돼요. 선수 계정과 지난 경기 기록은 유지돼요.</p>${['주장','부주장'].includes(p.role)?'<div class="ig-warn">팀 대표 권한도 즉시 해제돼요. 공석의 새 대표는 운영진 승인으로 지정해요.</div>':''}<div class="ig-actions">${action('취소','leave-cancel',true)}<button type="button" class="ig-action ig-danger cursor-interaction" data-act="leave-confirm">탈퇴하기</button></div>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});modal.showModal();}
function handleNewAction(id){
 if(id==='logout-preview'){draft.verified=false;draft.otp={code:'',input:'',expires:0,email:'',attempts:0};state.page='login';return true;}
 if(id==='leave-cancel'){draft.pendingLeave=null;root.querySelector('.ig-dialog').close();return true;}
 if(id==='leave-confirm'){const pending=draft.pendingLeave,p=viewer();if(pending&&p.id===pending.playerId&&p.team===pending.teamId){const t=teamFor(p);p.team=null;p.role='무소속';draft.selected.schedule.delete(p.id);refreshStanding(t);draft.notice='팀 탈퇴가 완료된 상태예요. 지금은 무소속이며 지난 경기 기록은 유지돼요.';}draft.pendingLeave=null;root.querySelector('.ig-dialog').close();state.page='member';return true;}
 if(id==='leader-request'){const r=draft.leadership,c=Number(r.captain),v=Number(r.vice);if(!['주장','부주장'].includes(viewer().role)||viewer().team!=='optimal')draft.notice='현재 팀 대표만 요청할 수 있어요.';else if(c===v)draft.notice='주장과 부주장을 서로 다른 선수로 선택해주세요.';else if(![c,v].every(id=>activeMembers().some(p=>p.id===id)))draft.notice='현재 팀 소속 선수만 지정할 수 있어요.';else if(players[c].role==='주장'&&players[v].role==='부주장')draft.notice='새 대표를 선택해주세요. 현재 대표와 같아요.';else {r.request={captain:c,vice:v};r.status='pending';draft.notice='교체 요청을 등록했어요. 운영진 승인 전까지는 기존 권한이 유지돼요.';}return true;}
 if(id==='leader-approve'||id==='leader-return'){const r=draft.leadership;if(state.role!=='admin'||r.status!=='pending')return true;if(id==='leader-return'){if(!draft.admin.note.trim())draft.notice='보완 사유를 남겨주세요.';else {r.status='returned';draft.notice='보완 요청을 기록했어요.';}return true;}const q=r.request;if(!q||q.captain===q.vice||![q.captain,q.vice].every(id=>players[id].team==='optimal')){draft.notice='요청한 선수가 탈퇴했거나 소속이 바뀌었어요. 새 요청이 필요해요.';return true;}activeMembers().forEach(p=>{if(['주장','부주장'].includes(p.role))p.role='선수';});players[q.captain].role='주장';players[q.vice].role='부주장';r.status='approved';draft.admin.log=draft.admin.log||[];draft.admin.log.unshift(`OPTIMAL FC 대표 교체 승인 · 주장 ${players[q.captain].name} / 부주장 ${players[q.vice].name}`);draft.notice='승인한 시점부터 새 대표 권한을 적용한 상태예요.';return true;}
 return false;
}
function referee(){const r=draft.result,own=r.started?r:{a:3,b:2,pa:0,pb:0,submitted:true},other=r.started?r.opponentRecord:{a:3,b:2,pa:0,pb:0};const blocked=r.disputed||r.conflict||(r.started&&(!r.submitted||draft.match.refType==='external'||!other||!scoresMatch()));const done=draft.ref.approved||r.final;return workspace(`${pageTop('REFEREE DESK','공정한 한 경기를 함께 만들어요.','배정 요청을 확인하고, 양 팀 기록이 일치하는 경기를 최종 승인해요.')}${refRequestPanel()}<section class="ig-panel"><div class="ig-rowhead"><h2>결과 최종 승인</h2><span class="${blocked?'ig-recruit-badge':'ig-pending'}">${done?'공식 확정 · 시안':blocked?'확정 보류':'양 팀 제출 완료'}</span></div><h3 class="ig-matchtitle">OPTIMAL FC × GRADIENT FC</h3><p class="ig-caption">10월 15일 (목) · KAIST 풋살장 · 담당 심판 남서현 / 배정 수락 완료</p><div class="ig-workcols"><div>${comparison(own,other)}<div class="ig-two"><p class="ig-note"><strong>OPTIMAL FC 기록</strong><br>${r.submitted?activeMembers().filter(p=>draft.selected.result.has(p.id)).map(p=>`${p.name}${draft.goals[p.id]?` ${draft.goals[p.id]}골`:''}`).join(' · '):'출전 6명 · 박지훈 2골 · 정유진 1골'}</p><p class="ig-note"><strong>GRADIENT FC 기록</strong><br>${other?'출전 6명 · 오현우 2골':'상대 팀 기록 제출 대기'}</p></div></div><aside class="ig-panel ig-panel-soft"><h3 style="font-size:14px;margin-bottom:11px">${blocked?'지금은 승인할 수 없어요.':done?'공식 기록에 반영됐어요.':'경기 기록을 확인해주세요.'}</h3><p class="ig-note">${blocked?'양 팀 제출 누락·스코어 불일치·이의 제기가 있으면 최종 승인을 막아요.':'심판으로 진행한 경기의 스코어와 양 팀 기록을 확인하고 승인해요.'}</p><div class="ig-tiny-actions">${action(done?'최종 승인 완료':'결과 최종 승인','ref-final',false,blocked||done)}${action('이견 전달 · 운영진 검토','ref-issue',true,done)}</div></aside></div>${notice()}</section><p class="ig-caption">배정 요청은 예정 경기, 최종 승인은 이미 치른 별도 경기 예시예요.</p>`);}
function admin(){const a=draft.admin,tab=state.adminTab,mismatch=draft.result.submitted&&draft.result.opponentRecord&&!scoresMatch();return workspace(`${pageTop('LEAGUE OPERATIONS','리그의 다음 단계를 확인해요.','신청과 검토가 필요한 기록을 한곳에서 관리해요.')}<div class="ig-admin-tabs" role="group" aria-label="운영 관리 분류">${[['teams','팀 등록 신청'],['leaders','대표 교체'],['external','외부 심판 경기'],['issues','이의 제기 · 스코어 불일치']].map(([v,l])=>`<button type="button" class="cursor-interaction" data-admin-tab="${v}" aria-pressed="${tab===v}">${l}</button>`).join('')}</div><div class="ig-workcols"><div>${tab==='teams'?`<section class="ig-panel"><div class="ig-rowhead"><h2>VECTOR FC</h2><span class="ig-pending">${a.teamStatus==='pending'?'등록 승인 대기':a.teamStatus==='approved'?'팀 등록 승인 완료':'보완 요청'}</span></div><p class="ig-note">“각자의 방향을 모아, 하나의 팀으로.”</p><dl class="ig-detail-list"><dt>등록 선수</dt><dd>8명 · 신청 명단 예시</dd><dt>주장</dt><dd>이도현</dd><dt>부주장</dt><dd>김서현</dd><dt>연구실</dt><dd>통계학습연구실 · 의사결정연구실</dd><dt>신청 상태</dt><dd>학교 이메일 인증 선수로 구성 · 동시 팀 소속 없음</dd></dl><p class="ig-note"><strong>구성원</strong><br>이도현 · 김서현 · 정하은 · 박시우 · 한도영 · 오채린 · 류지호 · 문서진</p><div class="ig-message">선수 6~20명 · 주장/부주장 지정 조건 충족</div>${adminNote()}<div class="ig-actions">${action('팀 등록 승인','admin-team-approve',false,a.teamStatus!=='pending')}${action('보완 요청','admin-team-return',true,a.teamStatus!=='pending')}</div></section>`:tab==='leaders'?adminLeadership():tab==='external'?`<section class="ig-panel"><div class="ig-rowhead"><h2>외부 심판 경기 승인</h2><span class="ig-pending">${a.externalStatus==='pending'?'운영진 최종 승인 대기':'최종 승인 완료 · 시안'}</span></div><h3 class="ig-matchtitle">데이터킥 × 오버타임 FC</h3><p class="ig-note">10월 14일 (수) · KAIST 풋살장<br>외부 심판: 이정호 · 양 팀 외부 인원</p><table class="ig-score-compare"><caption>양 팀 제출 기록 비교</caption><thead><tr><th>제출 팀</th><th>확인</th><th>스코어</th></tr></thead><tbody><tr><td>데이터킥</td><td>주장 확인 완료</td><td>2 : 1</td></tr><tr><td>오버타임 FC</td><td>부주장 확인 완료</td><td>2 : 1</td></tr></tbody></table><p class="ig-note">데이터킥 · 백승우 2골 / 오버타임 FC  else if(id==='schedule-submit'){const m=draft.match;if(activeMembers().length<6||members(opponent()).length<6)draft.notice='팀 인원이 6명 미만으로 참가 유예 중이에요. 인원 충원 후 공식 경기를 등록해주세요.';else if(!m.date||!m.time||!m.place.trim())draft.notice='경기 날짜·시간·장소를 확인해주세요.';else if(m.refType==='external'){if(!m.external.trim()||!m.externalConfirmed)draft.notice='외부 심판 이름과 경기 진행 수락 여부를 확인해주세요. 배정 전에는 공식 등록을 보류해요.';else {m.accepted=true;m.submitted=true;draft.notice='외부 심판 배정을 확인하고 공식 일정 등록을 완료한 상태예요. 결과 최종 승인은 운영진이 맡아요.';}}else {const ids=[...m.candidates].filter(id=>eligibleRefs().some(p=>p.id===id));if(!ids.length)draft.notice='요청할 심판을 한 명 이상 선택해주세요.';else {m.sentTo=ids;m.requested=true;m.winner=null;m.accepted=false;m.submitted=false;m.declined.clear();draft.notice=`심판 ${ids.length}명에게 홈페이지 요청과 이메일 알림을 보낼 상태예요. 먼저 한 명이 수락할 때까지 공식 등록을 보류해요. 실제 이메일은 보내지 않았어요.`;}}}
 else if(id==='ref-request-reset'){resetAssignment();draft.notice='이전 요청과 배정을 종료한 상태예요. 후보를 다시 선택해주세요.';}
 else if(id==='ref-load-example'){const m=draft.match;resetAssignment();m.opponent='gradient';m.refType='internal';m.sentTo=[18,43];m.candidates=new Set(m.sentTo);m.requested=true;draft.notice='두 명에게 동시에 요청한 예시예요. 실제 메일은 보내지 않았어요.';}
 else if(id==='result-submit'){const r=draft.result,total=activeMembers().filter(p=>draft.selected.result.has(p.id)).reduce((s,p)=>s+(draft.goals[p.id]||0),0);if(r.a===r.b&&r.pa===r.pb)draft.notice='승부차기로 승자를 정해주세요.';else if(total!==r.a)draft.notice=`우리 팀 선수 득점 합계 ${total}골과 우리 팀 스코어 ${r.a}골이 달라요.`;else {r.submitted=true;r.started=true;clearApproval();}}
 else if(id==='result-edit'){draft.result.submitted=false;draft.result.opponentRecord=null;clearApproval();draft.notice='기록 수정 후 양 팀 제출·확인과 최종 승인을 다시 진행해요.';}
 else if(id==='other-match'||id==='other-mismatch'){const r=draft.result;r.opponentRecord={a:r.a,b:r.b+(id==='other-mismatch'?1:0),pa:r.pa,pb:r.pb};clearApproval();if(id==='other-mismatch'){r.conflict=true;draft.conflictRecord={own:{a:r.a,b:r.b,pa:r.pa,pb:r.pb},other:{...r.opponentRecord}};draft.admin.issue='score';}if(id==='other-mismatch')draft.notice='스코어 불일치를 감지했어요. 운영진 알림 대상에 추가하고 확정을 보류해요. 실제 이메일은 전송하지 않았어요.';}
 else if(id==='dispute'||id==='ref-issue'){draft.result.disputed=true;draft.admin.issue='manual';clearApproval();draft.notice='이의 제기를 운영진 검토 대기 상태로 표시했어요. 공식 기록 확정을 보류해요.';}
 else if(id==='member-toggle')draft.member.free=!draft.member.free;
 else if(id==='ref-invite-accept')acceptReferee(viewer().id);
 else if(id==='ref-invite-decline'){draft.match.declined.add(viewer().id);draft.notice='배정 요청을 거절했어요. 다른 후보의 수락은 계속 기다려요.';}
 else if(id==='ref-final'){const r=draft.result;if(r.disputed||r.conflict||(r.submitted&&(!r.opponentRecord||!scoresMatch()))){draft.notice='미제출·불일치·이의 제기 상태에서는 승인할 수 없어요.';}else if(draft.match.refType==='external'&&r.submitted){draft.notice='외부 심판 경기는 운영진이 최종 승인해요.';}else {draft.ref.approved=true;if(r.submitted)r.final=true;draft.notice='공식 확정 상태를 미리 보여드려요. 실제 Elo는 계산하지 않았어요.';}}
 else if(id==='issue-score'||id==='issue-manual'){draft.admin.issue=id==='issue-manual'?'manual':'score';draft.admin.issueStatus='pending';}
 else if(id.startsWith('admin-')){
  const a=draft.admin;a.log=a.log||[];
  if(['admin-team-return','admin-issue-return'].includes(id)&&!a.note.trim()){draft.notice='요청 사유를 검토 메모에 남겨주세요.';}
  else if(id==='admin-team-approve'&&a.teamStatus==='pending'){a.teamStatus='approved';a.log.unshift('VECTOR FC 등록 승인');draft.notice='팀 등록 승인 완료 상태예요.';}
  else if(id==='admin-team-return'&&a.teamStatus==='pending'){a.teamStatus='returned';a.log.unshift(`VECTOR FC 보완 요청 · ${a.note}`);draft.notice='홈페이지에서 확인할 보완 요청을 기록한 상태예요.';}
  else if(id==='admin-external-approve'&&a.externalChecked&&a.externalStatus==='pending'){a.externalStatus='approved';a.log.unshift('데이터킥 × 오버타임 FC · 외부 심판 경기 최종 승인');draft.notice='공식 경기 확정 상태예요. 실제 서버 저장과 Elo 반영은 하지 않았어요.';}
  else if(id==='admin-issue-return'&&a.issueStatus==='pending'){a.issueStatus='returned';a.log.unshift(`OPTIMAL FC × GRADIENT FC 재제출 요청 · ${a.note}`);draft.result.submitted=false;draft.result.started=true;draft.result.opponentRecord=null;draft.result.conflict=false;draft.result.disputed=false;clearApproval();draft.notice='양 팀에 수정·재제출을 요청한 상태예요. 경기 확정은 계속 보류돼요.';}
 }
 render();persist();root.querySelector('.ig-announcement').textContent=draft.notice||'미리보기 화면을 변경했어요.';
});

render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:design});tweak.addColorPicker(visual,'accent',{label:'포인트 컬러',reference:'--ig-accent'});tweak.addSlider(visual,'radius',{label:'카드 둥글기',min:0,max:20,step:2,unit:'px',reference:'--ig-radius'});tweak.addSelect(visual,'playersLayout',{label:'선수 카드 배치',options:['4열','3열']});}
